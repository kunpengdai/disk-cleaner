<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磁盘清理</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand" data-i18n="appTitle">磁盘清理</div>
    <div id="drives" class="drives"></div>
    <div class="actions">
      <button id="btn-quick" class="primary"></button>
      <button id="btn-full"></button>
      <button id="btn-cancel" class="hidden" data-i18n="cancel">取消</button>
    </div>
    <div id="admin" class="admin"></div>
    <button id="btn-lang" class="lang" title="中文 / English"></button>
  </header>

  <div id="progress" class="progress hidden">
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div id="progress-text" class="progress-text"></div>
  </div>

  <main class="main">
    <section class="tree-pane">
      <div class="tree-head">
        <div class="c-name" data-sort="name" data-i18n="colName">名称</div>
        <div class="c-size" data-sort="size" data-i18n="colSize">大小</div>
        <div class="c-bar" data-i18n="colShare">占上级</div>
        <div class="c-files" data-sort="files" data-i18n="colFiles">文件数</div>
        <div class="c-risk" data-i18n="colRisk">风险</div>
        <div class="c-mtime" data-sort="mtime" data-i18n="colMtime">修改时间</div>
      </div>
      <div id="tree" class="tree"><div id="tree-inner" class="tree-inner"></div></div>
      <div id="empty" class="empty"></div>
    </section>

    <aside class="side">
      <div class="tabs">
        <button data-tab="detail" class="tab active" data-i18n="tabDetail">详情</button>
        <button data-tab="hits" class="tab" data-i18n="tabHits">可清理汇总</button>
      </div>
      <div id="tab-detail" class="tab-body"></div>
      <div id="tab-hits" class="tab-body hidden"></div>
    </aside>
  </main>

  <footer class="basket">
    <div id="basket-text" class="muted"></div>
    <div class="basket-actions">
      <button id="btn-log" class="link" data-i18n="deleteLog">删除记录</button>
      <button id="btn-clear" class="hidden" data-i18n="clearList">清空清单</button>
      <button id="btn-delete" class="danger" disabled data-i18n="deleteSelected">删除所选…</button>
    </div>
  </footer>

  <div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
